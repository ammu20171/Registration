{% extends "base.html" %}

{% block title %}Admin Login - Hackathon Committee{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-5" style="min-height: 70vh;">
    <div class="col-md-5">
        <!-- Glass Login Panel -->
        <div class="card glass-panel border-0 shadow-lg">
            <div class="card-header card-header-accent bg-transparent text-center py-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-gradient-primary rounded-circle mb-3" style="width: 60px; height: 60px;">
                    <i class="bi bi-shield-lock-fill fs-3 text-white"></i>
                </div>
                <h3 class="font-outfit fw-bold tracking-wide mb-1">ADMIN PORTAL</h3>
                <p class="text-secondary mb-0">Sign in to manage hackathon registrations</p>
            </div>
            
            <div class="card-body p-4 p-md-5">
                <form action="/admin/login" method="POST" class="needs-validation" novalidate>
                    <div class="mb-4">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark-card border-secondary-subtle text-secondary"><i class="bi bi-person-fill"></i></span>
                            <input type="text" class="form-control" id="username" name="username" required placeholder="Enter admin username" autocomplete="username">
                            <div class="invalid-feedback">Please enter your username.</div>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark-card border-secondary-subtle text-secondary"><i class="bi bi-key-fill"></i></span>
                            <input type="password" class="form-control" id="password" name="password" required placeholder="Enter password" autocomplete="current-password">
                            <div class="invalid-feedback">Please enter your password.</div>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-gradient w-100 py-3 rounded-pill mt-2">
                        Sign In <i class="bi bi-box-arrow-in-right ms-1"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
